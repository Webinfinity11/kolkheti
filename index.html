           fitted over the constellation and clipped to the outline traced from
           the last video frame so it never crosses the stars. The wordmark sits

           revealed inside the cursor spotlight. -->
      <g id="fleece" mask="url(#spotMask)" clip-path="url(#mapClip)">
        <image href="assets/colchia-skin.webp?v=10" width="1215" height="658" transform="matrix(0.69951 0.00825 0.00793 0.64725 244.98 119.92)"/>
        <ellipse class="brand__halo" cx="676" cy="349" rx="250" ry="70"/>

          <text class="brand__tag" x="676" y="383" textLength="112" lengthAdjust="spacing">BORN RARE</text>

    <div class="hint hint--start" id="hintStart">
      <span>Scroll</span>
      <i></i>
    </div>

    <!-- Fades in once the scroll reaches the map (.stage.is-end in style.css) -->
    <nav class="enter" aria-label="Main menu">
      <a href="/artists">Artists</a>
      <a href="/jewelry">Jewelry</a>
    </nav>

    <!-- Tells visitors the map hides something; gone once they find it -->
    <p class="map-hint" aria-hidden="true">
      <span class="map-hint__mouse">Hover over the map</span>
      <span class="map-hint__touch">Touch and hold the map</span>
    </p>

    <button class="next-btn" type="button" id="nextOpen">Next Exhibition</button>

<!-- Sign-up for the next exhibition. Submissions go to Web3Forms, which
     emails them to the address behind ACCESS_KEY in script.js. -->
<dialog class="signup" id="signup" aria-labelledby="signupTitle">
  <button class="signup__close" type="button" id="signupClose" aria-label="Close">×</button>
  <form class="signup__form" id="signupForm" novalidate>
    <h2 class="signup__title" id="signupTitle">Next Exhibition</h2>
    <svg class="signup__cross" viewBox="-10 -10 20 20" aria-hidden="true"><use href="#bolnisi"/></svg>
    <p class="signup__lead">Leave your email and we will let you know when the next Maison Colchia exhibition opens.</p>
    <label class="signup__field">
      <span>Name</span>
      <input type="text" name="name" autocomplete="name">
    </label>
    <label class="signup__field">
      <span>Email</span>
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <!-- Honeypot: people never see it, bots fill it in -->
    <input class="signup__trap" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off">
    <button class="signup__submit" type="submit">Notify me</button>
    <p class="signup__status" id="signupStatus" role="status"></p>
  </form>
</dialog>

<script src="script.js?v=25"></script>
