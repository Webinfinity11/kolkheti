<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>საქართველო — სამყაროს დაბადებიდან</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Noto+Sans+Georgian:wght@300;400&display=swap">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>

<div class="loader" id="loader">
  <p class="loader__mark">MAISON KOLKHETI</p>
  <div class="loader__bar"><span id="loaderBar"></span></div>
  <p id="loaderText">0%</p>
</div>

<main class="track" id="track">
  <div class="stage">
    <canvas id="canvas"></canvas>

    <!-- Same 1280x720 coordinate space as the video frames; viewBox is set in script.js to crop like the canvas -->
    <svg class="overlay" id="overlay" viewBox="0 0 1280 720" preserveAspectRatio="none">
      <defs>
        <radialGradient id="fade" gradientUnits="userSpaceOnUse" cx="570" cy="300" r="560" gradientTransform="translate(570 300) scale(1 0.62) translate(-570 -300)">
          <stop offset="0.62" stop-color="#fff"/>
          <stop offset="1" stop-color="#000"/>
        </radialGradient>
        <mask id="fleeceMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720">
          <rect width="1280" height="720" fill="url(#fade)"/>
        </mask>

        <!-- Cursor spotlight: soft circle that reveals the golden fleece -->
        <radialGradient id="spotGrad">
          <stop offset="0" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.4" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.6" stop-color="#fff" stop-opacity="0.75"/>
          <stop offset="0.75" stop-color="#fff" stop-opacity="0.4"/>
          <stop offset="0.88" stop-color="#fff" stop-opacity="0.12"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="spotMask" maskUnits="userSpaceOnUse" x="-2000" y="-3000" width="5280" height="7000">
          <circle id="spot" cx="-999" cy="-999" r="0" fill="url(#spotGrad)"/>
        </mask>
      </defs>

      <g mask="url(#fleeceMask)">
        <g id="fleece" mask="url(#spotMask)">
          <image href="assets/golden-fleece.webp" x="-282" y="-147" width="1638" height="914"/>
        </g>
      </g>

      <!-- Revealed letter by letter through the same cursor spotlight -->
      <text class="brand" x="640" y="352" text-anchor="middle" mask="url(#spotMask)">MAISON KOLKHETI</text>

      <!-- Hover area: outline of Georgia traced from the last video frame -->
      <polygon id="hit" class="hit" points="258,160 285,137 340,143 410,172 470,200 525,188 580,200 620,237 680,260 700,285 760,265 830,265 905,300 900,345 985,385 960,420 1020,475 995,510 900,470 850,450 800,488 720,487 650,500 600,445 550,452 480,440 435,440 460,380 440,300 420,265 380,230 300,195"/>
    </svg>

    <div class="hint hint--start" id="hintStart">
      <span>სქროლი</span>
      <i></i>
    </div>

    <!-- Both fade in once the scroll reaches the map (.stage.is-end in style.css) -->
    <a class="mark" href="index.html">MAISON KOLKHETI</a>
    <nav class="enter" aria-label="მთავარი მენიუ">
      <a href="artists.html"><b>01</b>მხატვრები</a>
      <a href="jewelry.html"><b>02</b>საიუველირო</a>
    </nav>
  </div>
</main>

<script src="script.js?v=15"></script>
</body>
</html>
