<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAISON KOLKHETI — Georgia, from the birth of the universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500&display=swap">
<link rel="stylesheet" href="style.css?v=22">
</head>
<body>

<div class="loader" id="loader">
  <p class="loader__mark">MAISON KOLKHETI</p>
  <div class="loader__bar"><span id="loaderBar"></span></div>
  <p id="loaderText">0%</p>
</div>

<main class="track" id="track">
  <div class="stage">
    <canvas id="canvas"></canvas>

    <!-- Same 1280x720 coordinate space as the video frames; viewBox is set in script.js to crop like the canvas -->
    <svg class="overlay" id="overlay" viewBox="0 0 1280 720" preserveAspectRatio="none">
      <defs>
        <!-- Cursor spotlight: soft circle that reveals the map illustration -->
        <radialGradient id="spotGrad">
          <stop offset="0" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.4" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.6" stop-color="#fff" stop-opacity="0.75"/>
          <stop offset="0.75" stop-color="#fff" stop-opacity="0.4"/>
          <stop offset="0.88" stop-color="#fff" stop-opacity="0.12"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="spotMask" maskUnits="userSpaceOnUse" x="-2000" y="-3000" width="5280" height="7000">
          <circle id="spot" cx="-999" cy="-999" r="0" fill="url(#spotGrad)"/>
        </mask>
      </defs>

      <!-- Illustrated map, used untouched; the transform lays its border over the constellation's stars -->
      <g id="fleece" mask="url(#spotMask)">
        <image href="assets/maison-colchia.webp" width="1536" height="1024" transform="matrix(0.57051 -0.01180 0.05970 0.48471 195.93 94.95)"/>
      </g>

      <!-- Revealed letter by letter through the same cursor spotlight -->
      <text class="brand" x="640" y="352" text-anchor="middle" mask="url(#spotMask)">MAISON KOLKHETI</text>

      <!-- Hover area: outline of Georgia traced from the last video frame -->
      <polygon id="hit" class="hit" points="258,160 285,137 340,143 410,172 470,200 525,188 580,200 620,237 680,260 700,285 760,265 830,265 905,300 900,345 985,385 960,420 1020,475 995,510 900,470 850,450 800,488 720,487 650,500 600,445 550,452 480,440 435,440 460,380 440,300 420,265 380,230 300,195"/>
    </svg>

    <div class="hint hint--start" id="hintStart">
      <span>Scroll</span>
      <i></i>
    </div>

    <!-- Fades in once the scroll reaches the map (.stage.is-end in style.css) -->
    <nav class="enter" aria-label="Main menu">
      <a href="/artists">Artists</a>
      <span class="enter__sep" aria-hidden="true"></span>
      <a href="/jewelry">Jewelry</a>
    </nav>
  </div>
</main>

<script src="script.js?v=21"></script>
</body>
</html>
